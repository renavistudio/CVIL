<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- FAVICON & BRAND ICONS -->
  <link rel="icon" type="image/png" href="/images/CVIL%20Logo.png" />
  <link rel="apple-touch-icon" href="/images/CVIL%20Logo.png" />

  <!-- SEO PRIMARIO -->
  <title>CVIL | Derecho Corporativo | Abogados en Zamora, Michoacán</title>
  <meta name="description"
    content="Firma legal líder en Zamora. Expertos en Derecho Corporativo, Penal y Blindaje Empresarial. Defensa estratégica, resultados contundentes y absoluta confidencialidad en Michoacán." />
  <meta name="keywords"
    content="CVIL, Derecho Corporativo Zamora, Abogados Zamora, Abogados Michoacán, Blindaje Empresarial, Derecho Penal Zamora, Abogados Corporativos" />
  <link rel="canonical" href="https://cvil.mx/" />

  <!-- OPEN GRAPH (Social Media) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CVIL | Derecho Corporativo" />
  <meta property="og:description"
    content="Protegemos su empresa, libertad y patrimonio con estrategia y firmeza en Zamora, Michoacán." />

  <meta property="og:url" content="https://cvil.mx/" />
  <meta property="og:site_name" content="CVIL" />

  <!-- TWITTER CARDS -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CVIL | Derecho Corporativo" />
  <meta name="twitter:description"
    content="Especialistas en Derecho Corporativo y Penal. Resultados tangibles cuando más importa." />
  <meta name="twitter:image" content="https://cvil.mx/images/og-image.jpg" />

  <!-- ESTRUCTURA DE DATOS (JSON-LD) - 10/10 SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LegalService",
      "name": "CVIL — Derecho Corporativo",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "C. Suiza 721-Piso 3, La Luneta",
        "addressLocality": "Zamora de Hidalgo",
        "addressRegion": "Michoacán",
        "postalCode": "59689",
        "addressCountry": "MX"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 19.988,
        "longitude": -102.285
      },
      "url": "https://cvil.mx",
      "telephone": "+523511277317",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
          ],
          "opens": "09:00",
          "closes": "18:00"
        }
      ],
      "priceRange": "$$$",
      "image": "https://cvil.mx/images/fachada.jpeg",
      "description": "Firma legal de alto perfil en Zamora, Michoacán especializada en Derecho Corporativo, Penal y Blindaje Empresarial.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+523511277317",
        "contactType": "Urgencias 24/7",
        "availableLanguage": ["Spanish"]
      }
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#050505', // Negro profundo
            charcoal: '#1a1a1a', // Gris oscuro elegante
            stone: '#8c8c8c',    // Gris medio para textos secundarios
            silver: '#e5e5e5',   // Gris claro para bordes finos
            offwhite: '#f9f9f9', // Blanco roto
            gold: '#B8860B',     // Dorado elegante para acentos y CTAs
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'], 
          },
          animation: {
            'scroll': 'scroll 30s linear infinite',
            'scroll-y': 'scrollY 20s linear infinite',
            'fade-in': 'fadeIn 1s ease-out forwards',
          },
          keyframes: {
            scroll: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' },
            },
            scrollY: {
              '0%': { transform: 'translateY(0)' },
              '100%': { transform: 'translateY(-50%)' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
    }

    body {
      background-color: #ffffff;
      color: #050505;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Clase para imágenes en escala de grises elegante con contraste */
    .bw-filter {
      filter: grayscale(100%) contrast(110%);
      transition: filter 0.5s ease;
    }

    .bw-filter:hover {
      filter: grayscale(0%) contrast(100%);
    }

    /* ===== 3D Flip Card ===== */
    .flip-container {
      perspective: 1500px;
    }

    .flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .flip-container:hover .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-front,
    .flip-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .flip-back {
      transform: rotateY(180deg);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
